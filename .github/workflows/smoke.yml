name: "Monitoring: weekly smoke test"

# Weekly check of the public site: sample pages of every kind and skin, legacy redirects
# (Edge Script), read-only hardening, custom 404. site/ is committed (generated
# on the Mac); pages are checked by status and headers.
# A failure sends GitHub's usual "workflow run failed" notification.

on:
  schedule:
    - cron: "41 5 * * 1" # every Monday at 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I scripts/smoke_test.py
